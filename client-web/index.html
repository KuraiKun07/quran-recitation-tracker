<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quran Recitation Tracker</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--card:#fff;--line:#d6d3d1;--ok:#16a34a;--bad:#dc2626;--hint:#facc15}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#fafaf9;--card:#292524;--line:#57534e}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;min-height:100vh;gap:12px}
.bar{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap}
select,input[type=number]{padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;max-width:100%}
#surah,#unit{flex:1 1 260px}#pageNo{width:72px}
button{padding:10px 18px;border:0;border-radius:10px;color:#fff;background:var(--ok);font-size:15px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
button.rec{background:var(--bad)}button.sec{background:#57534e;padding:8px 14px;font-size:14px}
#page{width:100%;max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;direction:rtl;font-family:"Amiri","Traditional Arabic",serif;font-size:30px}
.line{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap;line-height:2.1;min-height:2.1em}
.line.short{justify-content:center;gap:.5em}
.hdr{text-align:center;border:2px double var(--line);border-radius:8px;margin:.15em 0;line-height:1.9;font-size:.9em}
.bas{text-align:center;line-height:2.1}
.wd{display:inline-block}
.w{padding:0 2px;border-radius:6px;border-bottom:2px solid transparent;transition:color .4s}
.w.out{opacity:.5}
.memo .w.hidden,.memo .w.hint{color:transparent;border-bottom-color:var(--line);user-select:none}
.memo .w.correct{color:var(--ok)}
.w.error{color:var(--bad);text-decoration:underline;cursor:pointer}
.w.unsure{color:#d97706;text-decoration:underline dotted;cursor:pointer}
.w.hint{color:#a16207;animation:pulse 1s infinite}.memo .w.hint{color:#a16207}
.num{font-size:.6em;opacity:.6;padding:0 3px;border-radius:6px}
.num[data-j]{cursor:pointer}.num[data-j]:hover{background:rgba(250,204,21,.35)}.num.done{color:var(--ok);opacity:1}
@keyframes pulse{0%,100%{background:rgba(250,204,21,.15)}50%{background:rgba(250,204,21,.65)}}
body.spread main{max-width:1400px}
#page.two{max-width:1300px;display:flex;flex-direction:row;padding:14px 0}
#page.two .pg{flex:1 1 0;min-width:0;padding:0 14px}
#page.two .pg:first-child{border-left:1px solid var(--line)}
:root{--gold:#a8741a;--hdr1:#e9f2f0;--hdr2:#cde2de}
@media(prefers-color-scheme:dark){:root{--gold:#d9b25a;--hdr1:#21403c;--hdr2:#173029}}
.line{line-height:var(--lh,57px);height:var(--lh,57px);min-height:0}
.bas{line-height:var(--lh,57px);height:var(--lh,57px)}
.hdr{position:relative;display:flex;align-items:center;justify-content:center;height:calc(var(--lh,57px) - .3em);margin:.15em 0;padding:0 2.4em;
 line-height:1;font-size:1em;font-weight:700;color:var(--fg);text-align:center;border:1.5px solid var(--gold);border-radius:8px;
 background:linear-gradient(var(--hdr1),var(--hdr2));box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4.5px var(--gold)}
.hdr::before,.hdr::after{content:"\2756";position:absolute;top:50%;transform:translateY(-52%);color:var(--gold);font-size:1.05em;font-weight:400}
.hdr::before{right:.7em}.hdr::after{left:.7em}
.num{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:1.9em;height:1.9em;padding:0 .2em;margin:0 .2em;
 border:1.5px solid currentColor;border-radius:999px;color:var(--gold);font-size:.5em;font-weight:700;line-height:1;opacity:1;
 box-shadow:0 0 0 2px var(--card),0 0 0 3px currentColor}
@media(prefers-reduced-motion:reduce){.w.hint{animation:none;background:rgba(250,204,21,.4)}}
canvas{width:100%;height:56px}
#status{font-size:14px;opacity:.75}#verified{font-size:14px;opacity:.85}
#sheet{position:fixed;inset:auto 0 0 0;background:var(--card);padding:24px;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #0005;display:none;font-size:20px}
#next{order:-1}#prev{order:1}
:root{--rev:#0284c7;--assist:#9333ea}
@media(prefers-color-scheme:dark){:root{--rev:#38bdf8;--assist:#c4a1ff}}
.memo .w.hidden.rev{color:var(--rev);border-bottom-color:var(--rev)}
.memo .w.correct.rev{color:var(--assist)}
.num.assist{color:var(--assist);opacity:1}
.line{gap:.12em}.line>.num{margin:0;align-self:center}

c-right:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 18l6-6-6-6'/%3E%3C/svg%3E");--ic-book:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/%3E%3Cpath d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/%3E%3C/svg%3E");--ic-bulb:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 18h6M10 22h4'/%3E%3Cpath d='M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z'/%3E%3C/svg%3E");--ic-x:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M18 6L6 18M6 6l12 12'/%3E%3C/svg%3E");--bg:#F4EFEA;--fg:#23302a;--card:#FDFBF7;--line:#dccfb6;--paper:#FDFBF7;--paper2:#F8F3EA;--ink:#1c2a24;--green:#1E4D3B;--green2:#0F382C;--gold:#C5A059;--hdr1:#1E4D3B;--hdr2:#0F382C;--muted:#7a7467;--shadow:rgba(60,45,20,.30);--bar:rgba(244,239,234,.88);--ok:#15803d}
@media(prefers-color-scheme:dark){:root:not([data-theme="paper"]){--bg:#0D131A;--fg:#ECE6D8;--card:#141C24;--line:#2c3742;--paper:#141b22;--paper2:#1a232c;--ink:#ECE6D8;--green:#2b6a54;--green2:#17382f;--gold:#C9A961;--hdr1:#1e4a3d;--hdr2:#102a23;--muted:#98a2a8;--shadow:rgba(0,0,0,.65);--bar:rgba(13,19,26,.86);--ok:#4ade80;}}
:root[data-theme="night"]{--bg:#0D131A;--fg:#ECE6D8;--card:#141C24;--line:#2c3742;--paper:#141b22;--paper2:#1a232c;--ink:#ECE6D8;--green:#2b6a54;--green2:#17382f;--gold:#C9A961;--hdr1:#1e4a3d;--hdr2:#102a23;--muted:#98a2a8;--shadow:rgba(0,0,0,.65);--bar:rgba(13,19,26,.86);--ok:#4ade80;}
body{background:var(--bg);background-image:radial-gradient(circle at 50% -10%,rgba(197,160,89,.10),transparent 55%);color:var(--fg)}
main{padding:18px 16px 215px;gap:16px}
.ic,#deck button::before,#stage>button::before,.segb::before{content:"";display:inline-block;width:1.15em;height:1.15em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.i-mic{--m:var(--ic-mic)}.i-gear{--m:var(--ic-gear)}.i-chev{--m:var(--ic-chev)}.i-book{--m:var(--ic-book)}.i-bulb{--m:var(--ic-bulb)}.i-x{--m:var(--ic-x)}
#appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--bar);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:transparent;color:var(--fg);border:1px solid var(--line);font-size:15px}
.hbtn.round{padding:9px;width:40px;height:40px;justify-content:center}.hbtn:hover,.segb:hover{border-color:var(--gold)}
#selBtn{font-family:"Amiri","Traditional Arabic",serif;font-size:19px;direction:rtl;max-width:42vw}#selTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pagePill{background:var(--paper2);font-family:"Amiri","Traditional Arabic",serif;font-size:18px;direction:rtl}
.hright{display:flex;align-items:center;gap:10px}.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper2)}
.segb{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:transparent;color:var(--muted);border:0;border-radius:0;font-size:14px}
.segb.on{background:linear-gradient(135deg,var(--green),var(--green2));color:#F6ECCD}.segb::before{width:1.05em;height:1.05em}
#mRead::before{--m:var(--ic-book)}#mMemo::before{--m:var(--ic-bulb)}
#backdrop{position:fixed;inset:0;background:rgba(10,14,12,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#backdrop.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:min(420px,92vw);background:var(--paper);color:var(--fg);z-index:60;overflow:auto;padding:16px 18px 30px;transition:transform .25s ease;box-shadow:0 0 50px var(--shadow)}
.drawer.left{left:0;transform:translateX(-105%)}.drawer.right{right:0;transform:translateX(105%)}.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.dhead h2,.modal h2{margin:0;font-size:18px;font-weight:600}
.dbody{display:flex;flex-direction:column;gap:16px}.dsec{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper2)}
.dsec h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer select,.drawer input[type=number],.modal input[type=number]{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--fg)}
.drawer .bar{padding:0}.drawer button.sec{background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.drawer input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:25px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;vertical-align:middle;margin-right:8px;transition:background .2s}
.drawer input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s}
.drawer input[type=checkbox]:checked{background:var(--green)}.drawer input[type=checkbox]:checked::after{transform:translateX(19px)}
.themeseg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.themeseg button{flex:1;background:transparent;color:var(--muted);border:0;border-radius:0;padding:9px}
.themeseg button.on{background:linear-gradient(135deg,var(--green),var(--green2));color:#F6ECCD}
.modal{display:none;position:fixed;left:50%;top:22%;transform:translateX(-50%);width:min(380px,92vw);background:var(--paper);color:var(--fg);border:1px solid var(--gold);border-radius:18px;padding:20px;z-index:60;box-shadow:0 20px 60px var(--shadow)}
.modal.open{display:block}.modal .mrow{margin:14px 0}.modal input[type=range]{width:100%;accent-color:var(--gold)}.mhint{color:var(--muted);font-size:13px;margin-top:6px}
#stage{display:flex;align-items:center;justify-content:center;gap:12px}#stage #page{flex:1 1 auto;min-width:0}
#stage>button{font-size:0;width:46px;height:46px;border-radius:50%;padding:0;background:var(--paper);color:var(--green);border:1px solid var(--gold);box-shadow:0 6px 16px -6px var(--shadow);display:flex;align-items:center;justify-content:center;flex:none}
#stage>button::before{width:22px;height:22px}#next::before{--m:var(--ic-left)}#prev::before{--m:var(--ic-right)}
#page{border:0;background:transparent;padding:0;max-width:680px;color:var(--ink)}
#page:not(.two),#page.two .pg{position:relative;background:var(--paper)}
#page:not(.two){padding:36px 40px;border-radius:6px;box-shadow:0 20px 44px -14px var(--shadow),0 2px 0 var(--line)}
#page.two{max-width:1300px;padding:0;border-radius:6px;overflow:hidden;box-shadow:0 24px 54px -16px var(--shadow)}
#page.two .pg{padding:36px 40px;border-left:0}
#page.two .pg:first-child{background:linear-gradient(to right,rgba(0,0,0,.16),transparent 9%),var(--paper)}
#page.two .pg:last-child{background:linear-gradient(to left,rgba(0,0,0,.16),transparent 9%),var(--paper)}

 stroke-width='1.4'%3E%3Cpath d='M2 38V11Q2 2 11 2H38'/%3E%3Cpath d='M7 38V14Q7 7 14 7H38' stroke-width='.8'/%3E%3Cg fill='%23C5A059' stroke='none'%3E%3Crect x='11' y='11' width='9' height='9'/%3E%3Crect x='11' y='11' width='9' height='9' transform='rotate(45 15.5 15.5)'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") right bottom/40px 40px no-repeat}

.hdr::before,.hdr::after{content:"";width:1.55em;height:1.55em;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='21' fill='none' stroke='%23C5A059' stroke-width='1.6'/%3E%3Ccircle cx='24' cy='24' r='17.5' fill='none' stroke='%23C5A059' stroke-width='.8'/%3E%3Cg fill='%23C5A059'%3E%3Crect x='14' y='14' width='20' height='20'/%3E%3Crect x='14' y='14' width='20' height='20' transform='rotate(45 24 24)'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='5.5' fill='%230F382C'/%3E%3Ccircle cx='24' cy='24' r='2' fill='%23C5A059'/%3E%3C/svg%3E") center/contain no-repeat;font-size:1em;transform:translateY(-50%)}
.hdr::before{right:.6em}.hdr::after{left:.6em}
.line.short{gap:.5em}
@keyframes turn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#page.turn{animation:turn .3s ease}
@media(prefers-reduced-motion:reduce){#page.turn{animation:none}.drawer,#backdrop{transition:none}}
#deck{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(940px,calc(100% - 20px));z-index:40;background:var(--bar);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:10px 16px 12px;box-shadow:0 16px 44px -12px var(--shadow);display:flex;flex-direction:column;gap:6px}
#deck .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#deck .sp{flex:1}
#micDot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(197,160,89,.7)}50%{box-shadow:0 0 0 8px rgba(197,160,89,0)}}
body.listening #micDot{background:var(--gold);animation:beat 1.4s infinite}
#status{font-size:13px;color:var(--muted)}#verified{font-size:13px;color:var(--ok)}

<div id="sheet"></div>
<script>

// ---------- range: a list of words (seq) that may span several surahs ----------
async function getSurah(n) {

  resync(); armHint(); await showPage(holdPg || seq[0].p); updateVerified();

}
function recount(j) {

}
function markNum(j) { const n = numEls.get(j); if (!n) return; const c = ayahs[j].done && ayahs[j].bad === 0, r = hasRev(j);
  n.classList.toggle('done', c && !r); n.classList.toggle('assist', c && r); }

}
function paintK(k) {

}

// ---------- reveal (memorization help) ----------

  if (cur >= seq.length) return;

var holdPg = 0;                                   // page to keep on screen while setRange() loads
async function applyPages() {                     // replaces the pages-patch version
  const cl = v => Math.min(Math.max(+v || 1, 1), 604);
  let a = cl($('pgFrom').value), b = cl($('pgTo').value || a);
  if (b < a) b = a;

  $('pgFrom').value = a; $('pgTo').value = b;
  const txt = d => d.rows.filter(r => r.t === 'text').flatMap(r => r.w);
  const [da, db] = await Promise.all([getPg(a), getPg(b)]);
  const wa = txt(da), wb = txt(db);
  if (!wa.length || !wb.length) throw new Error('Page has no text');
  let f = wa[0];

    const wp = txt(await getPg(a - 1)), pl = wp[wp.length - 1];

}
async function navTo(p) {

$('prev').onclick = () => navTo(shown - (twoShown ? 2 : 1)).catch(fail);
